  <script>
  let shopSpriteLoading=false;
  function ensureShopSprite(){if(document.getElementById("shop-svg-sprite")||shopSpriteLoading)return;shopSpriteLoading=true;fetch(`shop-icons.svg?v=${APP_VERSION}`,{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error("ikonfil");return r.text()}).then(text=>{const host=document.createElement("div");host.id="shop-svg-sprite";host.style.cssText="position:absolute;width:0;height:0;overflow:hidden;pointer-events:none";host.innerHTML=text;document.body.prepend(host);document.querySelectorAll("use[data-shop-use]").forEach(u=>u.setAttribute("href",`#${u.dataset.shopUse}`))}).catch(()=>{}).finally(()=>shopSpriteLoading=false)}
  function itemText(x,field="name"){return window.JegerI18n?.item(x,field,profile()?.language||"nb")||x[field]||""}
  function shopIcon(x){if(x.thumb)return`<img class="shop-icon product-thumb" src="${esc(x.thumb)}" alt="${esc(x.name)}">`;ensureShopSprite();return`<svg class="shop-icon" style="color:${x.color||"#4d672d"}" aria-hidden="true"><use data-shop-use="${esc(x.icon)}" href="shop-icons.svg#${esc(x.icon)}"></use></svg>`}
  let shopFilter="all";
  function openShop(page=0){
    const all=window.OUTFITTER_ITEMS||[],items=shopFilter==="jaktdamer"?all.filter(x=>x.source==="Jaktdamer.no"):shopFilter==="utstyr"?all.filter(x=>x.source!=="Jaktdamer.no"):all,p=profile(),per=8,pages=Math.max(1,Math.ceil(items.length/per));
    shopPage=Math.max(0,Math.min(page,pages-1));const balance=p.score-(p.spent||0),shown=items.slice(shopPage*per,shopPage*per+per);
    document.getElementById("shop-modal")?.remove();document.body.insertAdjacentHTML("beforeend",`<div class="modal shop-modal" id="shop-modal"><section class="modal-card"><div class="shop-top"><h2>🎒 Outfitter Shop</h2><div class="shop-balance">${balance} patronpoeng</div></div><nav class="shop-tabs"><button data-shop-filter="all" class="${shopFilter==="all"?"selected":""}">Alle (${all.length})</button><button data-shop-filter="jaktdamer" class="${shopFilter==="jaktdamer"?"selected":""}">Jaktdamer (${all.filter(x=>x.source==="Jaktdamer.no").length})</button><button data-shop-filter="utstyr" class="${shopFilter==="utstyr"?"selected":""}">Utstyr</button></nav><div class="shop-grid">${shown.length?shown.map(x=>{const owned=p.owned?.includes(x.id),equipped=p.equipped?.[x.type]===x.id,can=balance>=x.price,n=itemText(x),tier=itemText(x,"tier");return`<article class="shop-item ${owned?"owned":""}"><button class="item-photo" data-preview="${x.id}" aria-label="Se større bilde av ${esc(n)}"><i>${shopIcon(x)}</i></button><strong>${esc(n)}</strong><small>${esc(tier)} • ${x.price} poeng</small>${owned?`<button data-equip="${x.id}" ${equipped?"disabled":""}>${equipped?"✓ I bruk":"Ta i bruk"}</button>`:`<button data-buy="${x.id}" ${can?"":"disabled"}>${can?"Kjøp":"Spar videre"}</button>`}</article>`}).join(""):`<div class="shop-empty">Ingen varer i denne kategorien ennå.</div>`}</div><div class="shop-nav"><button data-shop-page="${shopPage-1}" ${shopPage===0?"disabled":""}>‹ Forrige</button><button id="close-shop">Lukk</button><button data-shop-page="${shopPage+1}" ${shopPage===pages-1?"disabled":""}>Neste ›</button></div></section></div>`);
    document.getElementById("close-shop").onclick=()=>document.getElementById("shop-modal").remove();document.querySelectorAll("[data-shop-filter]").forEach(b=>b.onclick=()=>{shopFilter=b.dataset.shopFilter;openShop(0)});document.querySelectorAll("[data-shop-page]").forEach(b=>b.onclick=()=>openShop(+b.dataset.shopPage));document.querySelectorAll("[data-preview]").forEach(b=>b.onclick=()=>openItemPreview(b.dataset.preview));document.querySelectorAll("[data-buy]").forEach(b=>b.onclick=()=>buyItem(b.dataset.buy));document.querySelectorAll("[data-equip]").forEach(b=>b.onclick=()=>equipItem(b.dataset.equip))
  }
  function openItemPreview(id){const x=(window.OUTFITTER_ITEMS||[]).find(i=>i.id===id),p=profile();if(!x)return;const owned=p.owned?.includes(x.id),equipped=p.equipped?.[x.type]===x.id,balance=p.score-(p.spent||0),can=balance>=x.price,n=itemText(x),d=itemText(x,"description");document.getElementById("item-preview")?.remove();document.body.insertAdjacentHTML("beforeend",`<div class="modal item-preview" id="item-preview"><section class="modal-card"><header><div><span class="eyebrow">SE FØR DU KJØPER</span><h2>${esc(n)}</h2></div><button id="close-preview" aria-label="Lukk">×</button></header><div class="preview-body"><div class="preview-picture">${x.image?`<img src="${esc(x.image)}" alt="${esc(n)}">`:shopIcon(x)}</div><div class="preview-info"><p>${esc(d)}</p><strong>${x.price} patronpoeng</strong>${x.source?`<small>Bildeforbilde: ${esc(x.source)}</small>`:""}</div></div><footer><button id="preview-back">Tilbake</button>${owned?`<button class="primary" id="preview-equip" ${equipped?"disabled":""}>${equipped?"✓ I bruk":"Ta i bruk"}</button>`:`<button class="primary" id="preview-buy" ${can?"":"disabled"}>${can?"Kjøp":"Du må spare flere patronpoeng"}</button>`}</footer></section></div>`);const close=()=>document.getElementById("item-preview")?.remove();document.getElementById("close-preview").onclick=close;document.getElementById("preview-back").onclick=close;document.getElementById("preview-buy")?.addEventListener("click",()=>{close();buyItem(id)});document.getElementById("preview-equip")?.addEventListener("click",()=>{close();equipItem(id)})}
  function buyItem(id){const p=profile(),item=(window.OUTFITTER_ITEMS||[]).find(x=>x.id===id);if(!item||p.owned?.includes(id))return;const balance=p.score-(p.spent||0);if(balance<item.price)return;p.spent=(p.spent||0)+item.price;p.owned=p.owned||[];p.owned.push(id);p.equipped=p.equipped||{};p.equipped[item.type]=id;save();openShop(shopPage)}
  function equipItem(id){const p=profile(),item=(window.OUTFITTER_ITEMS||[]).find(x=>x.id===id);if(!item||!p.owned?.includes(id))return;p.equipped=p.equipped||{};p.equipped[item.type]=id;save();openShop(shopPage);render()}
  document.addEventListener("click",e=>{if(e.target.closest("#shop,.shop-sign"))openShop(0);if(e.target.closest("#my-hunter"))openMyHunter();if(e.target.closest("#my-room"))openHuntingRoom(0)});
  function profileArt(p){if(p.appearance?.age==="adult")return p.avatar==="jente"?WOMAN:MAN;const dark=p.appearance?.preset==="dark-curls";return p.avatar==="jente"?(dark?DARK_GIRL:GIRL):(dark?DARK_BOY:BOY)}
  function decorateAvatar(){const stage=document.querySelector(".player-stage");if(!stage||!db?.active)return;const p=profile(),wanted=profileArt(p);let art=stage.querySelector(".player-art");if(art&&art.tagName!=="IMG"){const img=document.createElement("img");img.className="player-art";img.alt=p.avatar==="jente"?`Jente og ${p.dog}`:`Gutt og ${p.dog}`;img.src=wanted;art.replaceWith(img);art=img}if(art?.tagName==="IMG"&&art.getAttribute("src")!==wanted)art.src=wanted}
  function decorateDogImages(){if(!db?.active)return;const p=profile(),src=dogArt(p);document.querySelectorAll(".companion>img,.result>img").forEach(img=>{img.classList.add("breed-dog");if(img.getAttribute("src")!==src)img.src=src;img.alt=p.dog})}
  function openMyHunter(){
    const p=profile(),current=`${p.appearance?.age||"child"}-${p.avatar}-${p.appearance?.preset||"original"}`;
    const choices=[
      {id:"child-gutt-original",label:"Gutt – brunt hår",src:BOY,avatar:"gutt",age:"child",preset:"original"},
      {id:"child-gutt-dark-curls",label:"Gutt – mørk hud og krøller",src:DARK_BOY,avatar:"gutt",age:"child",preset:"dark-curls"},
      {id:"child-jente-original",label:"Jente – brunt hår",src:GIRL,avatar:"jente",age:"child",preset:"original"},
      {id:"child-jente-dark-curls",label:"Jente – mørk hud og krøller",src:DARK_GIRL,avatar:"jente",age:"child",preset:"dark-curls"},
      {id:"adult-gutt-original",label:"Voksen mann",src:MAN,avatar:"gutt",age:"adult",preset:"original"},
      {id:"adult-jente-original",label:"Voksen dame",src:WOMAN,avatar:"jente",age:"adult",preset:"original"}
    ];

  function maybeShowJervenIntro(){const p=profile();if(!p||p.jervenIntroSeen||view!=="home"||document.getElementById("jerven-intro"))return;document.body.insertAdjacentHTML("beforeend",`<div class="modal jerven-intro" id="jerven-intro"><section class="modal-card"><img src="${ICON}" alt="Jerven"><div><span class="eyebrow">DIN JAKTKAMERAT</span><h2>Hei! Jeg heter Jerven 🐾</h2><p>Jeg er en tysk jaktterrier og blir med deg gjennom hele Jegerprøven.</p><ul><li>Jeg hjelper deg å finne neste oppdrag.</li><li>Jeg minner deg på spørsmål du bør øve mer på.</li><li>Jeg feirer med deg når du svarer riktig!</li></ul><button id="start-with-jerven">Bli med, Jerven! ›</button></div></section></div>`);document.getElementById("start-with-jerven").onclick=()=>{p.jervenIntroSeen=true;save();document.getElementById("jerven-intro")?.remove()}}
  function correctCount(p,n){return Q.filter(q=>q.c.includes(n)&&p.correct?.[q.id]).length}
  function isUnlocked(p,n){return n===1||correctCount(p,n-1)>=10}
  function nextPraise(p){if(!p.praiseBag.length){p.praiseBag=PRAISE.map((_,i)=>i);for(let i=p.praiseBag.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[p.praiseBag[i],p.praiseBag[j]]=[p.praiseBag[j],p.praiseBag[i]]}if(p.praiseBag[p.praiseBag.length-1]===p.lastPraise)[p.praiseBag[0],p.praiseBag[p.praiseBag.length-1]]=[p.praiseBag[p.praiseBag.length-1],p.praiseBag[0]]}const i=p.praiseBag.pop();p.lastPraise=i;return window.JegerI18n?.praise(i,p)||PRAISE[i].replaceAll("{name}",p.name).replaceAll("{dog}",p.dog)}
  function ammo(type,withName=true){return`<span class="ammo a${type}"><i></i>${withName?`<b>${type==="22"?".22 LR":type==="12"?"Kaliber 12":"6,5×55"}</b>`:""}</span>`}
  function questionPriority(q,p,now=Date.now()){if((p.mastery[q.id]||0)>=5)return 3;if(!p.seen[q.id])return 1;if((p.review[q.id]?.due||0)<=now)return 0;return 2}
  function profileQuestionOrder(p,q){let h=2166136261,s=`${p.id}:${q.id}`;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
  function orderQuestions(list,p){const now=Date.now();return[...list].sort((a,b)=>questionPriority(a,p,now)-questionPriority(b,p,now)||(p.seen[a.id]||0)-(p.seen[b.id]||0)||profileQuestionOrder(p,a)-profileQuestionOrder(p,b))}
  function dueQuestions(p){currentCollection=0;const unlocked=Q.filter(q=>isUnlocked(p,Number(String(q.id).split(".")[0]))),due=unlocked.filter(q=>questionPriority(q,p)===0),fresh=unlocked.filter(q=>questionPriority(q,p)===1);return orderQuestions([...due,...fresh],p).slice(0,20).map(q=>window.JegerI18n?.question(q,p.language)||q)}
  function render(){document.body.classList.toggle("playing",view==="quiz");if(view==="profiles"||!profile())return profiles();if(view==="home")return home();if(view==="quiz")return quizView();if(view==="result")return result()}
  function profiles(){const nextNumber=(db.profileCounter||0)+1,per=4,pages=Math.max(1,Math.ceil(db.profiles.length/per));profilePage=Math.max(0,Math.min(profilePage,pages-1));const shown=db.profiles.slice(profilePage*per,profilePage*per+per);document.getElementById("app").innerHTML=`<main class="profile-screen"><section class="profile-box"><img src="${ICON}" alt="Jerven"><span class="eyebrow">VELKOMMEN TIL JAKTBUA</span><h1>Hvem skal spille?</h1><p>Spillet husker den sist brukte profilen og åpner den automatisk neste gang.</p><div class="profile-list">${shown.map(p=>`<button data-profile="${p.id}"><span>${p.appearance?.age==="adult"?"🧑":p.avatar==="gutt"?"👦":"👧"}</span><strong>${esc(p.name)} & ${esc(p.dog)}</strong><small>${p.score} poeng</small></button>`).join("")||`<p class="no-profiles">Lag den første profilen nedenfor.</p>`}</div>${pages>1?`<nav class="profile-pager"><button id="profile-prev" ${profilePage===0?"disabled":""}>‹ Forrige</button><strong>${profilePage+1} / ${pages}</strong><button id="profile-next" ${profilePage===pages-1?"disabled":""}>Neste ›</button></nav>`:""}<div class="form"><h2>＋ Lag ny profil</h2><div class="avatars"><button data-avatar="gutt" class="${avatar==="gutt"?"selected":""}"><span>👦</span>Gutt</button><button data-avatar="jente" class="${avatar==="jente"?"selected":""}"><span>👧</span>Jente</button></div><label>Profilnavn<input id="name" value="Spiller ${nextNumber}" maxlength="20"></label><label>Navn på hunden<input id="dog" value="Jerven" maxlength="20"></label><button class="primary" id="create">Start eventyret ›</button></div></section></main>`;document.querySelectorAll("[data-profile]").forEach(b=>b.onclick=()=>{db.active=b.dataset.profile;save();view="home";render()});document.getElementById("profile-prev")?.addEventListener("click",()=>{profilePage--;profiles()});document.getElementById("profile-next")?.addEventListener("click",()=>{profilePage++;profiles()});document.querySelectorAll("[data-avatar]").forEach(b=>b.onclick=()=>{avatar=b.dataset.avatar;profiles()});document.getElementById("create").onclick=()=>{const p=newProfile(document.getElementById("name").value.trim(),avatar,document.getElementById("dog").value.trim(),nextNumber);db.profiles.push(p);db.profileCounter=nextNumber;db.active=p.id;save();view="home";render()}}
  function shell(inner){const p=profile(),balance=p.score-(p.spent||0);return`<header class="topbar"><button class="brand" id="brand"><img src="${ICON}" alt="${esc(p.dog)}"><span><strong>Jegerprøven</strong><small>${esc(p.name)} & ${esc(p.dog)}</small></span></button><div class="spacer"></div><button class="pill" id="update-app" title="Hent nyeste versjon">↻ Oppdater · v${APP_VERSION}</button><button class="pill" id="my-hunter">🧑 Min jeger</button><button class="pill" id="shop">🎒 Outfitter Shop</button><button class="pill profile-change" id="profiles"><span>${p.appearance?.age==="adult"?"🧑":p.avatar==="gutt"?"👦":"👧"}</span> Bytt profil</button><div class="wallet">${ammo("22",false)}<strong>${balance}</strong><span>poeng</span></div></header>${inner}`}
  function home(){const p=profile(),due=dueQuestions(p),hero=p.avatar==="jente"?GIRL:BOY;const cards=collections.map(c=>{const count=Q.filter(q=>q.c.includes(c[0])).length,done=p.done[c[0]]||0;return`<button class="collection ${!count?"empty":""} ${c[0]===10?"extra":""}" data-col="${c[0]}"><span class="num">${String(c[0]).padStart(2,"0")}</span><i class="ico">${c[2]}</i><h3>${c[1]}</h3><p>${c[3]}</p><footer>${count?`${done}/${count} øvd`:"Kommer senere"}<span>›</span></footer></button>`}).join("");document.getElementById("app").innerHTML=shell(`<main class="page game-home"><section class="adventure-layout"><aside class="player-stage"><div class="wood-sign"><h1>${esc(p.name)} og ${esc(p.dog)}</h1><p>LÆR • FORSTÅ • RESPEKTER</p></div><img class="player-art" src="${hero}" alt="${esc(p.name)} og ${esc(p.dog)}"></aside><section class="map-board"><header class="map-head"><div><h2>Velg jegeroppdrag</h2><p>Samlingene følger jegerprøvekurset. Samling 10 er ekstra turkunnskap.</p></div><div class="level-badge">🏆 ${p.score} patronpoeng</div></header><div class="grid">${cards}</div><div class="game-tools"><section class="review-card"><i>🔁</i><div><h3>Dagens repetisjon</h3><p>${due.length?`${due.length} spørsmål er klare nå.`:"Alt er øvd for i dag."}</p></div><button id="review" ${due.length?"":"disabled"}>Start</button></section><section class="score-card"><i>⚔️</i><div><h3>Spill mot venner</h3><p>Samme spørsmål til alle. Flest riktige på 30 sekunder vinner.</p></div><button class="install" id="multiplayer">Spill</button></section></div></section></section></main>`);bindShell();document.querySelectorAll("[data-col]").forEach(b=>b.onclick=()=>startCollection(+b.dataset.col));document.getElementById("review").onclick=()=>{quiz=dueQuestions(p);if(quiz.length)startQuiz()};document.getElementById("multiplayer").onclick=openMultiplayer}
  function openMultiplayer(){const b=document.getElementById("multiplayer");if(window.JegerMultiplayer)return window.JegerMultiplayer.open();if(b){b.disabled=true;b.textContent="Henter …"}const old=document.getElementById("multiplayer-loader");if(old)old.remove();const s=document.createElement("script");s.id="multiplayer-loader";s.src=`multiplayer.js?v=${APP_VERSION}-${Date.now()}`;s.onload=()=>{if(b){b.disabled=false;b.textContent="Spill"}if(window.JegerMultiplayer)window.JegerMultiplayer.open();else alert("Multiplayer-filen ble hentet, men kunne ikke startes.")};s.onerror=()=>{if(b){b.disabled=false;b.textContent="Prøv igjen"}alert("Kunne ikke hente multiplayer. Kontroller internettforbindelsen og prøv igjen.")};document.body.appendChild(s)}
  function bindShell(){document.getElementById("brand").onclick=()=>{view="home";render()};document.getElementById("profiles").onclick=()=>{view="profiles";render()};document.getElementById("update-app").onclick=updateApp;const p=profile();document.querySelectorAll(".collection[data-col]").forEach(b=>{const n=+b.dataset.col,open=isUnlocked(p,n),count=correctCount(p,n);if(!open){b.disabled=true;b.classList.add("locked");b.querySelector("footer").innerHTML=`🔒 ${correctCount(p,n-1)}/10 riktige i samling ${n-1}`}else b.querySelector("footer").innerHTML=`✓ ${count}/10 for neste nivå <span>›</span>`});const head=document.querySelector(".map-head>div");if(head&&window.JEGER_SOURCES?.checked&&!head.querySelector(".rules-checked")){const d=document.createElement("div");d.className="rules-checked";d.textContent=`Regelverket kontrollert ${window.JEGER_SOURCES.checked.split("-").reverse().join(".")}`;head.appendChild(d)}const card=document.querySelector(".review-card");if(card){card.querySelector("h3").textContent="Fortsett hele spørsmålkøen";card.querySelector("p").textContent="Neste 20 spørsmål – nye og minst øvde først.";const b=card.querySelector("button");b.textContent="Fortsett";b.disabled=false}const badge=document.querySelector(".difficulty");if(badge&&quiz[qi])badge.textContent+=` • MESTRING ${profile().mastery[quiz[qi].id]||0}/5`;const praise=document.querySelector(".success h2 span");if(praise&&answered&&currentPraise)praise.textContent=currentPraise}
  async function updateApp(){const b=document.getElementById("update-app");if(b){b.disabled=true;b.textContent="↻ Tømmer gammel versjon …"}try{if("caches" in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith("jegerproven-")).map(k=>caches.delete(k)))}if("serviceWorker" in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()))}const url=new URL(location.href);url.searchParams.set("oppdater",Date.now());location.replace(url.href)}catch(err){if(b){b.disabled=false;b.textContent=`↻ Oppdater · v${APP_VERSION}`}alert((err.message||"Kunne ikke oppdatere akkurat nå.")+"\n\nLukk spillet helt og åpne lenken på nytt.")}}
  function startCollection(n){const p=profile(),list=Q.filter(q=>q.c.includes(n));if(!isUnlocked(p,n))return alert(`Du må svare riktig på 10 forskjellige spørsmål i samling ${n-1} først.`);if(!list.length)return alert("Denne samlingen får spørsmål i en senere godkjenningsrunde.");currentCollection=n;quiz=orderQuestions(list,p).map(q=>window.JegerI18n?.question(q,p.language)||q);startQuiz()}
  function startQuiz(){qi=0;attempts=0;wrong=[];answered=false;currentPraise="";view="quiz";render();try{const full=document.documentElement.requestFullscreen?.();if(full&&typeof full.catch==="function")full.catch(()=>{})}catch{}try{const locked=globalThis.screen?.orientation?.lock?.("landscape");if(locked&&typeof locked.catch==="function")locked.catch(()=>{})}catch{}}
  function quizView(){const p=profile(),q=quiz[qi],reward=Math.max(1,3-attempts),label=q.m==="22"?"LETT":q.m==="12"?"MIDDELS":"VANSKELIG",diagram=q.diagram&&window.WEAPON_DIAGRAMS?.[q.diagram]?window.WEAPON_DIAGRAMS[q.diagram]():"";document.getElementById("app").innerHTML=shell(`<main class="quiz"><section class="quiz-stage"><aside class="companion"><img src="${ICON}" alt="${esc(p.dog)}"><span>JAKTKAMERAT</span><h2>${esc(p.dog)}</h2><p>Følger deg gjennom oppdraget</p><div class="shop-sign">OUTFITTER SHOP<br><small>Utstyr låses opp snart</small></div></aside><div class="quiz-main"><div class="quiz-head"><button class="pill" id="home">⌂ Hjem</button><div>${collections.find(c=>c[0]===currentCollection)?.[2]||"🔁"} ${collections.find(c=>c[0]===currentCollection)?.[1]||"Repetisjon"}<strong>Spørsmål ${qi+1} av ${quiz.length}</strong></div><aside>${ammo(q.m,false)} × ${reward}</aside></div><div class="progress"><b style="width:${(qi+1)/quiz.length*100}%"></b></div><article class="question ${q.diagram?"diagram-question":""}"><span class="difficulty">${label}</span><h1>${q.q}</h1>${q.image?`<img class="animal-photo" src="${q.image}" alt="Dyrebilde til spørsmålet"><small class="credit">Foto: ${q.credit||"oppgitt kilde"}</small>`:""}${diagram||`<div class="answers">${q.a.map((x,i)=>`<button data-answer="${i}" class="${wrong.includes(i)?"wrong":""} ${answered&&i===q.r?"correct":""}" ${answered||wrong.includes(i)?"disabled":""}><i>${String.fromCharCode(65+i)}</i>${x}<b>${wrong.includes(i)?"✕":answered&&i===q.r?"✓":""}</b></button>`).join("")}</div>`}${!answered&&wrong.length?`<p class="hint"><strong>Ikke helt, ${esc(p.name)}.</strong> Tenk deg godt om og prøv igjen!</p>`:""}${answered?`<section class="success"><h2>✓ <span>Rett. Bra jobba ${esc(p.name)}.<br>Du er flink 👏👏👏</span></h2><p>${q.e}</p><div class="reward">${ammo(q.m)} &nbsp; +${reward} ${reward===1?"patron":"patroner"}</div><button id="next">${qi===quiz.length-1?"Fullfør nivået":"Neste spørsmål"} ›</button></section>`:""}</article></div></section></main>`);if(q.diagram){const task=document.querySelector(".weapon-task");if(answered)task?.classList.add("answered");wrong.forEach(i=>task?.querySelectorAll(`[data-answer=\"${i}\"]`).forEach(x=>x.classList.add("wrong-part")));if(answered)task?.querySelectorAll(`[data-answer=\"${q.r}\"]`).forEach(x=>x.classList.add("correct-part"))}bindShell();document.getElementById("home").onclick=()=>{view="home";render()};document.querySelectorAll("[data-answer]").forEach(b=>b.onclick=()=>answer(+b.dataset.answer));if(answered)document.getElementById("next").onclick=next}
  function streakMilestone(n){return n===3||n===5||n===10||n===15||n===20||(n>20&&n%10===0)}
  function showStreakReward(){if(!pendingStreak||document.getElementById("streak-modal"))return;const n=pendingStreak;pendingStreak=null,document.body.insertAdjacentHTML("beforeend",`<div class="modal streak-modal" id="streak-modal"><section class="modal-card"><div class="streak-fire">🔥</div><span class="eyebrow">TREFFREKKE!</span><h2>${n} riktige på rad!</h2><p>Fantastisk! Du får <strong>${n} ekstra .22 LR-patroner</strong>.</p><div class="streak-ammo">${ammo("22")} × ${n}</div><button id="close-streak">Fortsett ›</button></section></div>`);document.getElementById("close-streak").onclick=()=>document.getElementById("streak-modal").remove()}
  function answer(n){const p=profile(),q=quiz[qi];p.mastery=p.mastery||{};p.seen=p.seen||{};p.correct=p.correct||{};if(n===q.r){const firstTry=attempts===0&&!q.retry,count=Math.max(1,3-attempts),val=q.m==="22"?1:q.m==="12"?5:10;p.ammo[q.m]+=count;p.score+=count*val;p.correct[q.id]=true;if(firstTry){p.mastery[q.id]=Math.min(5,(p.mastery[q.id]||0)+1);p.streak=(p.streak||0)+1;p.bestStreak=Math.max(p.bestStreak||0,p.streak);if(streakMilestone(p.streak)){p.ammo["22"]+=p.streak;p.score+=p.streak;pendingStreak=p.streak}}p.seen[q.id]=Date.now();const level=firstTry?Math.min(5,(p.review[q.id]?.level||0)+1):0,days=[1,3,7,14,30,90][level];p.review[q.id]={level,due:Date.now()+days*86400000};currentPraise=nextPraise(p);answered=true;save()}else{p.streak=0;wrong.push(n);attempts++;const gap=2+Math.floor(Math.random()*4),target=qi+1+gap,pool=Q.filter(x=>x.id!==q.id&&x.c.some(c=>q.c.includes(c)));while(quiz.length<target&&pool.length)quiz.push({...pool[Math.floor(Math.random()*pool.length)],filler:true});quiz.splice(Math.min(target,quiz.length),0,{...q,retry:true});p.review[q.id]={level:0,due:Date.now()+86400000};save()}render();setTimeout(showStreakReward,0)}
  function next(){currentPraise="";if(qi===quiz.length-1){const p=profile();p.done[currentCollection]=quiz.length;save();view="result"}else{qi++;attempts=0;wrong=[];answered=false}render()}
  function result(){const p=profile();document.getElementById("app").innerHTML=shell(`<section class="result"><img src="${ICON}" alt="${esc(p.dog)}"><span class="eyebrow">NIVÅ FULLFØRT</span><h1>Fantastisk jobbet, ${esc(p.name)}!</h1><p>${esc(p.dog)} er klar for neste oppdrag.</p><button class="primary" id="back">Tilbake til jaktbua ›</button></section>`);bindShell();document.getElementById("back").onclick=()=>{view="home";render()}}
  function installHelp(){if(deferredPrompt){deferredPrompt.prompt();return}const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);document.body.insertAdjacentHTML("beforeend",`<div class="modal" id="modal"><section class="modal-card"><h2>Legg appen på hjemskjermen</h2><div class="steps">${ios?`<p><strong>1.</strong> Trykk på Del-symbolet nederst i Safari: □↑</p><p><strong>2.</strong> Velg «Legg til på Hjem-skjerm».</p><p><strong>3.</strong> Trykk «Legg til».</p>`:`<p><strong>1.</strong> Åpne nettlesermenyen ⋮.</p><p><strong>2.</strong> Velg «Legg til på startskjermen» eller «Installer app».</p><p><strong>3.</strong> Bekreft.</p>`}</div><button id="close">Jeg forstår</button></section></div>`);document.getElementById("close").onclick=()=>document.getElementById("modal").remove()}
  function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
  function showStartError(err){console.error(err);document.body.classList.remove("playing");document.getElementById("app").innerHTML=`<main class="profile-screen"><section class="profile-box"><img src="${ICON}" alt="Jerven"><h1>Oi! Appen stoppet.</h1><p>Kontroller at <strong>index.html</strong> og <strong>questions.js</strong> ligger i samme mappe, og last siden på nytt.</p><button class="primary" onclick="location.reload()">Last siden på nytt</button></section></main>`}
  window.addEventListener("error",e=>showStartError(e.error||e.message));
  window.addEventListener("unhandledrejection",e=>showStartError(e.reason));
  window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e});
  try{render()}catch(err){showStartError(err)}
  if("serviceWorker" in navigator&&location.protocol.startsWith("http")){navigator.serviceWorker.register("service-worker.js").catch(()=>{})}
