    {id:9,c:[1,6],q:"Hvorfor må jegeren tenke på hvor mye vilt som felles?",a:["For å ta vare på bestanden","For å spare bilder","Fordi patroner er tunge"],r:0,e:"Jakt skal være bærekraftig.",m:"12"},

    {id:16,c:[2,4,6],q:"Hvilket energikrav gjelder ved riflejakt på rådyr, bever og gaupe?",a:["98 joule","980 joule","9800 joule"],r:1,e:"Det kreves minst 980 joule på 100 meter.",m:"65"},

    {id:18,c:[2,6],q:"Hvor mange skudd kan en hagle til jakt maksimalt være ladd for?",a:["To","Fire","Seks"],r:0,e:"En hagle til jakt kan ikke være ladd for mer enn to skudd.",m:"12"},
    {id:19,c:[2,6],q:"Er blyhagl tillatt i forbindelse med jakt i våtmark?",a:["Ja","Nei","Bare om vinteren"],r:1,e:"Blyhagl er forbudt i forbindelse med jakt i våtmark.",m:"12"},

    {id:25,c:[5],q:"Hva hjelper rypas fjærkledde føtter den med?",a:["Å gå på snø og holde varmen","Å klatre","Å svømme under vann"],r:0,e:"Fjærene isolerer og fungerer som små truger.",m:"12"},
    {id:26,c:[5],q:"Hvilket kjennetegn passer best på beveren?",a:["Flat og bred hale","Buskete hale","Kort hale med hvit spiss"],r:0,e:"Den flate, brede halen er et tydelig kjennetegn.",m:"22"},
    {id:27,c:[5],q:"Hvilket kjennetegn har en voksen ringdue ofte på halsen?",a:["Et hvitt felt","En rød kam","Et langt skjegg"],r:0,e:"Voksne ringduer har et hvitt felt på siden av halsen.",m:"12"},
    {id:28,c:[5],q:"Hvilket kjennetegn er vanlig hos rødreven?",a:["Buskete hale med lys spiss","Flat hale","Hvitt gevir"],r:0,e:"Rødreven har vanligvis en buskete hale med lys spiss.",m:"22"},
    {id:29,c:[5],q:"Hvor hviler steinkobben ofte når den ikke er i vannet?",a:["På skjær og sandbanker","I tretopper","På høyfjellet"],r:0,e:"Steinkobben hviler ofte på skjær, holmer og sandbanker.",m:"12"},
    {id:30,c:[5,6],q:"Hvorfor må en seljeger være sikker på både art og område?",a:["Alle selarter har samme regler","Reglene kan variere mellom art og område","Bare for å ta bilder"],r:1,e:"Tillatelser, kvoter og områder kan variere.",m:"65"}
  ];
  let db=load(),view="profiles",avatar="gutt",quiz=[],qi=0,attempts=0,wrong=[],answered=false,currentCollection=1,deferredPrompt=null;
  function fresh(){return{schemaVersion:SCHEMA,active:null,profiles:[]}}
  function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&x.schemaVersion===SCHEMA)return x}catch{}return fresh()}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(err){console.warn("Kunne ikke lagre fremdrift",err)}}
  function profile(){return db.profiles.find(p=>p.id===db.active)}
  function newProfile(name,sex,dog){const id=globalThis.crypto?.randomUUID?.()||`profil-${Date.now()}-${Math.random().toString(16).slice(2)}`;return{id,name:name||"Lukas",avatar:sex,dog:dog||"Jerven",ammo:{22:0,12:0,65:0},done:{},review:{},score:0}}
  function ammo(type,withName=true){return`<span class="ammo a${type}"><i></i>${withName?`<b>${type==="22"?".22 LR":type==="12"?"Kaliber 12":"6,5×55"}</b>`:""}</span>`}
  function dueQuestions(p){const now=Date.now();return Q.filter(q=>p.review[q.id]&&p.review[q.id].due<=now)}
  function render(){document.body.classList.toggle("playing",view==="quiz");if(view==="profiles"||!profile())return profiles();if(view==="home")return home();if(view==="quiz")return quizView();if(view==="result")return result()}
  function profiles(){document.getElementById("app").innerHTML=`<main class="profile-screen"><section class="profile-box"><img src="${ICON}" alt="Jerven"><span class="eyebrow">VELKOMMEN TIL JAKTBUA</span><h1>Hvem skal spille?</h1><p>Hver spiller får egen profil. Patroner, repetisjoner og fremdrift lagres separat på denne enheten.</p><div class="profile-list">${db.profiles.map(p=>`<button data-profile="${p.id}"><span>${p.avatar==="gutt"?"👦":"👧"}</span><strong>${esc(p.name)} & ${esc(p.dog)}</strong><small>${p.score} poeng</small></button>`).join("")}</div><div class="form"><h2>＋ Lag ny profil</h2><div class="avatars"><button data-avatar="gutt" class="${avatar==="gutt"?"selected":""}"><span>👦</span>Gutt</button><button data-avatar="jente" class="${avatar==="jente"?"selected":""}"><span>👧</span>Jente</button></div><label>Profilnavn<input id="name" value="Lukas" maxlength="20"></label><label>Navn på hunden<input id="dog" value="Jerven" maxlength="20"></label><button class="primary" id="create">Start eventyret ›</button></div></section></main>`;document.querySelectorAll("[data-profile]").forEach(b=>b.onclick=()=>{db.active=b.dataset.profile;save();view="home";render()});document.querySelectorAll("[data-avatar]").forEach(b=>b.onclick=()=>{avatar=b.dataset.avatar;profiles()});document.getElementById("create").onclick=()=>{const p=newProfile(document.getElementById("name").value.trim(),avatar,document.getElementById("dog").value.trim());db.profiles.push(p);db.active=p.id;save();view="home";render()}}
  function shell(inner){const p=profile(),score=p.score;return`<header class="topbar"><button class="brand" id="brand"><img src="${ICON}" alt="${esc(p.dog)}"><span><strong>Jegerprøven</strong><small>${esc(p.name)} & ${esc(p.dog)}</small></span></button><div class="spacer"></div><button class="pill profile-change" id="profiles"><span>${p.avatar==="gutt"?"👦":"👧"}</span> Bytt profil</button><div class="wallet">${ammo("22",false)}<strong>${score}</strong><span>poeng</span></div></header>${inner}`}
  function home(){const p=profile(),due=dueQuestions(p),hero=p.avatar==="jente"?GIRL:BOY;const cards=collections.map(c=>{const count=Q.filter(q=>q.c.includes(c[0])).length,done=p.done[c[0]]||0;return`<button class="collection ${!count?"empty":""} ${c[0]===10?"extra":""}" data-col="${c[0]}"><span class="num">${String(c[0]).padStart(2,"0")}</span><i class="ico">${c[2]}</i><h3>${c[1]}</h3><p>${c[3]}</p><footer>${count?`${done}/${count} øvd`:"Kommer senere"}<span>›</span></footer></button>`}).join("");document.getElementById("app").innerHTML=shell(`<main class="page game-home"><section class="adventure-layout"><aside class="player-stage"><div class="wood-sign"><h1>${esc(p.name)} og ${esc(p.dog)}</h1><p>LÆR • FORSTÅ • RESPEKTER</p></div><img class="player-art" src="${hero}" alt="${esc(p.name)} og ${esc(p.dog)}"></aside><section class="map-board"><header class="map-head"><div><h2>Velg jegeroppdrag</h2><p>Samlingene følger jegerprøvekurset. Samling 10 er ekstra turkunnskap.</p></div><div class="level-badge">🏆 ${p.score} patronpoeng</div></header><div class="grid">${cards}</div><div class="game-tools"><section class="review-card"><i>🔁</i><div><h3>Dagens repetisjon</h3><p>${due.length?`${due.length} spørsmål er klare nå.`:"Alt er øvd for i dag."}</p></div><button id="review" ${due.length?"":"disabled"}>Start</button></section><section class="score-card"><i>🏅</i><div><h3>Scoreboard</h3><p>${db.profiles.slice().sort((a,b)=>b.score-a.score).map((x,i)=>`${i+1}. ${esc(x.name)} – ${x.score}`).join(" • ")||"Lag flere profiler for å konkurrere."}</p></div><button class="install" id="install">Installer</button></section></div></section></section></main>`);bindShell();document.querySelectorAll("[data-col]").forEach(b=>b.onclick=()=>startCollection(+b.dataset.col));document.getElementById("review").onclick=()=>{quiz=dueQuestions(p);if(quiz.length)startQuiz()};document.getElementById("install").onclick=installHelp}
  function bindShell(){document.getElementById("brand").onclick=()=>{view="home";render()};document.getElementById("profiles").onclick=()=>{view="profiles";render()}}
  function startCollection(n){const list=Q.filter(q=>q.c.includes(n));if(!list.length)return alert("Denne samlingen får spørsmål i en senere godkjenningsrunde.");currentCollection=n;quiz=[...list];startQuiz()}
  function startQuiz(){qi=0;attempts=0;wrong=[];answered=false;view="quiz";render();try{const full=document.documentElement.requestFullscreen?.();if(full&&typeof full.catch==="function")full.catch(()=>{})}catch{}try{const locked=globalThis.screen?.orientation?.lock?.("landscape");if(locked&&typeof locked.catch==="function")locked.catch(()=>{})}catch{}}
  function quizView(){const p=profile(),q=quiz[qi],reward=Math.max(1,3-attempts),label=q.m==="22"?"LETT":q.m==="12"?"MIDDELS":"VANSKELIG";document.getElementById("app").innerHTML=shell(`<main class="quiz"><section class="quiz-stage"><aside class="companion"><img src="${ICON}" alt="${esc(p.dog)}"><span>JAKTKAMERAT</span><h2>${esc(p.dog)}</h2><p>Følger deg gjennom oppdraget</p><div class="shop-sign">OUTFITTER SHOP<br><small>Utstyr låses opp snart</small></div></aside><div class="quiz-main"><div class="quiz-head"><button class="pill" id="home">⌂ Hjem</button><div>${collections.find(c=>c[0]===currentCollection)?.[2]||"🔁"} ${collections.find(c=>c[0]===currentCollection)?.[1]||"Repetisjon"}<strong>Spørsmål ${qi+1} av ${quiz.length}</strong></div><aside>${ammo(q.m,false)} × ${reward}</aside></div><div class="progress"><b style="width:${(qi+1)/quiz.length*100}%"></b></div><article class="question"><span class="difficulty">${label}</span><h1>${q.q}</h1>${q.image?`<img class="animal-photo" src="${q.image}" alt="Dyrebilde til spørsmålet"><small class="credit">Foto: ${q.credit||"oppgitt kilde"}</small>`:""}<div class="answers">${q.a.map((x,i)=>`<button data-answer="${i}" class="${wrong.includes(i)?"wrong":""} ${answered&&i===q.r?"correct":""}" ${answered||wrong.includes(i)?"disabled":""}><i>${String.fromCharCode(65+i)}</i>${x}<b>${wrong.includes(i)?"✕":answered&&i===q.r?"✓":""}</b></button>`).join("")}</div>${!answered&&wrong.length?`<p class="hint"><strong>Ikke helt, ${esc(p.name)}.</strong> Tenk deg godt om og prøv igjen!</p>`:""}${answered?`<section class="success"><h2>✓ <span>Rett. Bra jobba ${esc(p.name)}.<br>Du er flink 👏👏👏</span></h2><p>${q.e}</p><div class="reward">${ammo(q.m)} &nbsp; +${reward} ${reward===1?"patron":"patroner"}</div><button id="next">${qi===quiz.length-1?"Fullfør nivået":"Neste spørsmål"} ›</button></section>`:""}</article></div></section></main>`);bindShell();document.getElementById("home").onclick=()=>{view="home";render()};document.querySelectorAll("[data-answer]").forEach(b=>b.onclick=()=>answer(+b.dataset.answer));if(answered)document.getElementById("next").onclick=next}
  function answer(n){const p=profile(),q=quiz[qi];if(n===q.r){const count=Math.max(1,3-attempts),val=q.m==="22"?1:q.m==="12"?5:10;p.ammo[q.m]+=count;p.score+=count*val;const old=p.review[q.id]||{level:0};const level=attempts?0:Math.min(3,old.level+1),days=[1,3,7,30][level];p.review[q.id]={level,due:Date.now()+days*86400000};answered=true;save()}else{wrong.push(n);attempts++;const gap=2+Math.floor(Math.random()*4),target=qi+1+gap,pool=Q.filter(x=>x.id!==q.id&&x.c.some(c=>q.c.includes(c)));while(quiz.length<target&&pool.length)quiz.push({...pool[Math.floor(Math.random()*pool.length)],filler:true});quiz.splice(Math.min(target,quiz.length),0,{...q,retry:true});p.review[q.id]={level:0,due:Date.now()+86400000};save()}render()}
  function next(){if(qi===quiz.length-1){const p=profile();p.done[currentCollection]=quiz.length;save();view="result"}else{qi++;attempts=0;wrong=[];answered=false}render()}
  function result(){const p=profile();document.getElementById("app").innerHTML=shell(`<section class="result"><img src="${ICON}" alt="${esc(p.dog)}"><span class="eyebrow">NIVÅ FULLFØRT</span><h1>Fantastisk jobbet, ${esc(p.name)}!</h1><p>${esc(p.dog)} er klar for neste oppdrag.</p><button class="primary" id="back">Tilbake til jaktbua ›</button></section>`);bindShell();document.getElementById("back").onclick=()=>{view="home";render()}}
  function installHelp(){if(deferredPrompt){deferredPrompt.prompt();return}const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);document.body.insertAdjacentHTML("beforeend",`<div class="modal" id="modal"><section class="modal-card"><h2>Legg appen på hjemskjermen</h2><div class="steps">${ios?`<p><strong>1.</strong> Trykk på Del-symbolet nederst i Safari: □↑</p><p><strong>2.</strong> Velg «Legg til på Hjem-skjerm».</p><p><strong>3.</strong> Trykk «Legg til».</p>`:`<p><strong>1.</strong> Åpne nettlesermenyen ⋮.</p><p><strong>2.</strong> Velg «Legg til på startskjermen» eller «Installer app».</p><p><strong>3.</strong> Bekreft.</p>`}</div><button id="close">Jeg forstår</button></section></div>`);document.getElementById("close").onclick=()=>document.getElementById("modal").remove()}
  function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
  function showStartError(err){console.error(err);document.body.classList.remove("playing");document.getElementById("app").innerHTML=`<main class="profile-screen"><section class="profile-box"><img src="${ICON}" alt="Jerven"><h1>Oi! Appen stoppet.</h1><p>Kontroller at <strong>index.html</strong> og <strong>questions.js</strong> ligger i samme mappe, og last siden på nytt.</p><button class="primary" onclick="location.reload()">Last siden på nytt</button></section></main>`}
  window.addEventListener("error",e=>showStartError(e.error||e.message));
  window.addEventListener("unhandledrejection",e=>showStartError(e.reason));
  window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e});
  try{render()}catch(err){showStartError(err)}
  if("serviceWorker" in navigator&&location.protocol.startsWith("http")){navigator.serviceWorker.register("service-worker.js").catch(()=>{})}
  </script>
